name: Dalintour SFTP scope probe

on:
  push:
    branches:
      - main

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Probe SFTP scope (read-only)
        env:
          SFTP_HOST: ${{ secrets.BEGET_SFTP_HOST }}
          SFTP_USER: ${{ secrets.BEGET_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.BEGET_SFTP_PASSWORD }}
        run: |
          set -eu
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 1
          set net:timeout 20
          echo "ROOT"
          pwd
          cls -1
          echo "UP1"
          cd ..
          pwd
          cls -1
          echo "UP2"
          cd ../..
          pwd
          cls -1
          bye
          EOF
